# The archive's nginx config on the VPS (excerpt of /etc/nginx/sites-available/gerritsxd). The two
# limit_req_zone lines go at the top of the site file (http context); the locations inside server {}.
limit_req_zone $binary_remote_addr zone=discurso_ask:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=discurso_api:2m rate=10r/s;
    location ^~ /discurso/ {
        access_log off;   # privacy page promises no visit logs for the archive
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    }
    location ^~ /discurso/datos/ {
        access_log off;
        alias /var/www/gerritsxd/discurso-datos/;
        autoindex on;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /discurso/api/ {
        access_log off;
        limit_req zone=discurso_api burst=40 nodelay;
        limit_req_status 429;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://127.0.0.1:8431/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 4k;
    }
    location ^~ /discurso/datos/ {
        access_log off;
        alias /var/www/gerritsxd/discurso-datos/;
        autoindex on;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }
    location = /discurso/api/ask {
        access_log off;
        limit_req zone=discurso_ask burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8431/api/ask;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 4k;
        proxy_read_timeout 60s;
    }
    location ^~ /discurso/api/ {
        access_log off;
        limit_req zone=discurso_api burst=40 nodelay;
        limit_req_status 429;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://127.0.0.1:8431/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 4k;
    }
